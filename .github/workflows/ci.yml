name: "Better-Dime CI"

on:
  push:
    branches: [ master, develop ]
  pull_request:

env:
  NODE_IMAGE: node:22-alpine@sha256:16e22a550f3863206a3f701448c45f7912c6896a62de43add43bb9c86130c3e2

jobs:
  frontend-lint:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Frontend Lint
        run: docker run --rm -v ./frontend:/var/frontend -w /var/frontend --entrypoint "" ${{ env.NODE_IMAGE }} bash -c "yarn install && yarn run lint"

  frontend-build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Frontend Build
        run: docker run --rm -v ./frontend:/var/frontend -w /var/frontend --entrypoint "" ${{ env.NODE_IMAGE }} bash -c "yarn install && yarn run build"

  backend:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: network=host

      - name: Build docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: apir
          file: "apir/dev.Dockerfile"
          push: true
          tags: localhost:5000/swo/dime-apir:latest
          cache-from: type=gha,ignore-error=true
          cache-to: type=gha,mode=max
          build-args: |
            UID=1001
            GID=1001

      - name: Migrate DB
        run: docker compose -f docker-compose.ci.yml run -T apir /tmp/wait-for-it.sh mysql:3306 -s -t 50 -- bin/rails db:create db:schema:load

      - name: Run Tests
        run: docker compose -f docker-compose.ci.yml run -T apir bin/test

      - name: Generate OpenAPI schema
        run: docker compose -f docker-compose.ci.yml run -T -e OPENAPI=1 apir bundle exec rspec spec/requests/ --order defined

      - name: Verify OpenAPI schema is committed
        run: git diff --exit-code apir/doc/openapi.yaml

      - name: Lint
        run: docker compose -f docker-compose.ci.yml run --no-deps --rm -T apir bin/lint

  frontend-types:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Generate TypeScript types from OpenAPI schema
        run: cd frontend && npm run generate:types

      - name: Verify generated types are committed
        run: git diff --exit-code frontend/src/types/generated.ts
